<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九段南 地下に残す量の比較</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --text:#1f2933; --muted:#62707d; --accent:#d6336c; --line:#d9dee3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --panel:#22252b; --text:#e8eaed; --muted:#9aa4ae; --accent:#ff6b9a; --line:#3a3f47; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Yu Gothic UI","Meiryo",sans-serif; }
  #view { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; left:12px; width:290px; max-width:calc(100vw - 24px); max-height:calc(100vh - 24px); overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-sizing:border-box; font-size:13px; }
  h1 { font-size:15px; margin:0 0 4px; }
  .note { color:var(--muted); font-size:11px; line-height:1.5; margin:6px 0 0; white-space:pre-line; }
  .sec { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  .sec b { display:block; margin-bottom:6px; font-size:12px; }
  label { display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer; }
  .sw { width:12px; height:12px; border-radius:2px; border:1px solid #0003; flex:none; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:12px; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #stepText { margin-top:6px; font-size:12px; line-height:1.6; min-height:3em; }
  #hide { position:absolute; top:8px; right:10px; padding:2px 7px; }
  #panel.min > :not(h1):not(#hide) { display:none; }
  @media (max-width:600px) { #panel { top:auto; bottom:12px; max-height:46vh; } }
  /* 自動再生: 字幕と操作ボタン */
  #cap { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); width:min(880px, calc(100vw - 32px)); box-sizing:border-box;
         background:rgba(20,22,26,.78); color:#fff; border-radius:12px; padding:12px 18px; text-align:center; pointer-events:none;
         opacity:0; transition:opacity .5s; }
  #cap.show { opacity:1; }
  #cap, #player { z-index:20; }   /* 操作パネルより手前に出す */
  #cap .t { font-size:15px; color:#ffd43b; font-weight:bold; margin-bottom:4px; }
  #cap .c { font-size:clamp(16px, 2.4vw, 24px); line-height:1.5; font-weight:bold; }
  #player { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:6px; align-items:center;
            background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:5px 10px; font-size:13px; }
  #player button { font-size:15px; padding:4px 10px; border-radius:16px; }
  #player select { font:inherit; border-radius:6px; padding:2px 4px; background:var(--bg); color:var(--text); border:1px solid var(--line); }
  #prog { width:90px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; }
  #prog i { display:block; height:100%; width:0; background:var(--accent); }
  @media (max-width:600px) { #cap { bottom:60px; padding:8px 12px; } #panel { bottom:110px; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="cap"><div class="t" id="capT"></div><div class="c" id="capC"></div></div>
<div id="player">
  <button id="pPrev" title="前の手順">⏮</button><button id="pPlay" title="自動再生／一時停止">▶ 自動再生</button><button id="pNext" title="次の手順">⏭</button>
  <select id="pSpeed" title="1手順あたりの時間"><option value="4">はやい</option><option value="6" selected>ふつう</option><option value="9">ゆっくり</option></select>
  <div id="prog"><i></i></div>
</div>
<div id="panel">
  <button id="hide" title="パネルをたたむ">－</button>
  <h1 id="ttl"></h1>
  <div class="note" id="note"></div>
  <div class="sec" id="stepSec"><b>解体の手順</b><div class="btns" id="steps"></div><div id="stepText"></div></div>
  <div class="sec" id="togSec" style="display:none"><b>まとめて表示／非表示</b><div class="btns" id="togs"></div></div>
  <div class="sec"><b>視点</b><div class="btns" id="views"></div></div>
  <div class="sec"><b>表示する部分</b><div id="layers"></div></div>
</div>

  for (const f of HEXF) { const b = pos.length / 3; f.forEach(i => pos.push(v[i].x, v[i].y, v[i].z)); idx.push(b, b+1, b+2, b, b+2, b+3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color:h.color, side:THREE.DoubleSide}));
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({color:0x333333}));
  grp(h.group).add(m, e); colors[h.group] = colors[h.group] || h.color;
}
for (const m of (D.meshes || [])) {               // リアル寄り部品（円柱・クレーン・バックホウ・足場など）
  const v = m.verts.map(q => V(...q)), pos = v.flatMap(q => [q.x, q.y, q.z]), idx = [];
  for (const f of m.faces) for (let i = 1; i < f.length - 1; i++) idx.push(f[0], f[i], f[i+1]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const ng = g.toNonIndexed(); ng.computeVertexNormals();
  const op = m.opacity ?? 1;
  const mesh = new THREE.Mesh(ng, new THREE.MeshLambertMaterial({color:m.color, transparent:op<1, opacity:op, side:THREE.DoubleSide, depthWrite:op>=1}));
  grp(m.group).add(mesh);
  if (m.fit) bb.expandByObject(mesh);              // fit:true の部品は視点の自動調整に含める（箱が無いモデル用）
  if (op >= 1) grp(m.group).add(new THREE.LineSegments(new THREE.EdgesGeometry(ng, 35), new THREE.LineBasicMaterial({color:0x444444})));
  colors[m.group] = colors[m.group] || m.color;
}
for (const f of D.faces) {
  const v = f.pts.map(q => V(...q)); const a = [];
  for (let i = 1; i < v.length - 1; i++) a.push(v[0], v[i], v[i+1]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(a.flatMap(q => [q.x,q.y,q.z]), 3)); g.computeVertexNormals();
  grp(f.group).add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color:f.color, transparent:true, opacity:f.opacity ?? 0.6, side:THREE.DoubleSide})));
  colors[f.group] = colors[f.group] || f.color;
}
for (const l of D.lines) {
  const g = new THREE.BufferGeometry().setFromPoints(l.pts.map(q => V(...q)));
  grp(l.group).add(new THREE.Line(g, new THREE.LineBasicMaterial({color:l.color})));
  colors[l.group] = colors[l.group] || l.color;
}
const LBL = [];
for (const t of D.labels) {
  // 文字の長さに合わせてラベルの幅を決める（長い文字が見切れないように）
  const k = 4, font = `bold ${26*k}px "Yu Gothic UI", Meiryo, sans-serif`;
  const cv = document.createElement('canvas'); let c = cv.getContext('2d'); c.font = font;
  const tw = Math.ceil(c.measureText(t.text).width) + 12*k;
  cv.width = tw; cv.height = 48*k; c = cv.getContext('2d');
  c.font = font; c.textBaseline = 'middle';
  if (t.bg) { c.fillStyle = t.bg; c.fillRect(0, 0, tw, 48*k); }           // 注意書きなど: 背景色つき（例 bg:'#e03131', color:'#fff'）
  c.fillStyle = t.color || (dark ? '#ffffff' : '#1f2933'); c.fillText(t.text, 6*k, 24*k);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), depthTest:false, sizeAttenuation:false}));
  const LH = 0.024*(t.size||1); sp.scale.set((tw / (48*k)) * LH, LH, 1); sp.position.copy(V(t.x, t.y, t.z)); sp.renderOrder = 999; LBL.push({sp, ar: tw/(48*k)});
  (t.group ? grp(t.group) : scene).add(sp);
}
// 表示の切り替え
const box = document.getElementById('layers'), chk = {};
const order = [...(D.groupOrder||[]), ...Object.keys(groups).filter(n => !(D.groupOrder||[]).includes(n))];
for (const n of order) {
  if (!groups[n]) continue;
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox"><span class="sw" style="background:${colors[n]||'#888'}"></span>${n}`;
  const cb = l.querySelector('input'); cb.checked = !(D.hidden||[]).includes(n); groups[n].visible = cb.checked;
  cb.onchange = () => groups[n].visible = cb.checked; chk[n] = cb; box.appendChild(l);
}
function setVis(n, v){ if (chk[n]) { chk[n].checked = !!v; groups[n].visible = !!v; } }
// まとめて表示／非表示（toggles: [{label, groups}]。例: 作業風景をプレゼン中に出し入れする）
const togBtns = [];
function refreshTogs(){ togBtns.forEach(([b, t]) => { const on = t.groups.some(n => chk[n] && chk[n].checked); b.classList.toggle('on', on); b.textContent = `${t.label}：${on ? '表示中' : '非表示'}`; }); }
for (const t of (D.toggles || [])) {
  const b = document.createElement('button');
  b.onclick = () => {
    const on = t.groups.some(n => chk[n] && chk[n].checked);
    if (on) t.groups.forEach(n => setVis(n, false));
    else {                                       // 表示に戻すときは、今の手順で出ているはずのものだけ出す（同じ重機が2台重ならないように）
      const st = {}; for (const n of t.groups) st[n] = !(D.hidden||[]).includes(n);
      for (let k = 0; k <= cur && k < steps.length; k++) { (steps[k].hide||[]).forEach(n => { if (n in st) st[n] = false; }); (steps[k].show||[]).forEach(n => { if (n in st) st[n] = true; }); }
      const pick = t.groups.filter(n => st[n]); (pick.length ? pick : t.groups.slice(0, 1)).forEach(n => setVis(n, true));
    }
    refreshTogs();
  };
  document.getElementById('togs').appendChild(b); togBtns.push([b, t]);
}
if (togBtns.length) document.getElementById('togSec').style.display = '';
for (const n in chk) chk[n].addEventListener('change', refreshTogs);
// 手順
const steps = D.steps || [], sb = document.getElementById('steps'), btns = [];
const init = {}; for (const n in chk) init[n] = chk[n].checked;
let cur = 0, playing = false;                    // playing＝自動再生中
function step(i){
  cur = i;
  for (const n in init) setVis(n, init[n]);
  for (let k = 0; k <= i; k++) { (steps[k].hide||[]).forEach(n => setVis(n, false)); (steps[k].show||[]).forEach(n => setVis(n, true)); }
  btns.forEach((b, k) => b.classList.toggle('on', k === i)); document.getElementById('stepText').textContent = steps[i].text;
  if (typeof refreshTogs === 'function') refreshTogs();
  // 字幕（caption が無ければ説明文）
  document.getElementById('capT').textContent = `${steps[i].title}（${i + 1}/${steps.length}）`;
  document.getElementById('capC').textContent = steps[i].caption || steps[i].text;
  document.getElementById('cap').classList.add('show');
  try {                                          // 起動直後（視点の準備前）は飛ばす
    if (steps[i].view) setView(steps[i].view, playing);
    else if (playing) setView('斜め（道路側）', true);     // 自動再生中は手順ごとに基本の視点へ戻ってから回る
  } catch (err) {}
}
steps.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.title; b.onclick = () => step(i); sb.appendChild(b); btns.push(b); });
if (steps.length) step(0); else document.getElementById('stepSec').style.display = 'none';
// 視点（建物の大きさから自動）
const ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
const R = Math.max(sz.x, sz.y, sz.z) * 1.15 * Math.max(1, 1.3 / (isFinite(cam.aspect) && cam.aspect > 0 ? cam.aspect : 1.3));   // 縦長の画面（スマホ）ではもっと引く
const low = new THREE.Vector3(ctr.x + 0.15*R, bb.min.y + 0.12*R, ctr.z);      // 地下を見るときの注視点
const front = new THREE.Vector3(bb.min.x + 0.2*sz.x, bb.min.y + 0.35*sz.y, ctr.z); // 手前（道路側）を見るときの注視点
const VIEWS = {
  '斜め（道路側）': [[ctr.x - 1.0*R, ctr.y + 0.9*R, ctr.z + 1.3*R], ctr],
  '道路から':       [[ctr.x - 1.6*R, ctr.y + 0.15*R, ctr.z], ctr],
  '横から':         [[ctr.x, ctr.y + 0.15*R, ctr.z + 1.9*R], ctr],
  '真上':           [[ctr.x + 0.001, ctr.y + 2.4*R, ctr.z], ctr],
  '地下を見る':     [[low.x - 0.45*R, low.y + 0.95*R, low.z + 0.8*R], low],   // 上から見下ろして穴の中を見る
  '手前を上から':   [[front.x - 0.3*R, front.y + 0.85*R, front.z + 0.5*R], front], // 道路側（手前）の部分を上からのぞく
};
// 見る向きを回す（view_rot 度。建物の「道路側」が +X 側にあるときは 180 など）
if (D.viewRot) { const r = D.viewRot * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  for (const k in VIEWS) { const p = VIEWS[k][0], t = VIEWS[k][1], dx = p[0] - t.x, dz = p[2] - t.z;
    VIEWS[k][0] = [t.x + dx * c - dz * s, p[1], t.z + dx * s + dz * c]; } }
// 設定ファイルで足した視点（views: {名前: {eye:[x,y,z], target:[x,y,z]}}、mm）
for (const k in (D.views || {})) { const v = D.views[k]; VIEWS[k] = [V(...v.eye).toArray(), V(...v.target)]; }
const vb = document.getElementById('views');
// 視点の切り替え（自動再生中はなめらかに動かす）
let tween = null;
function setView(k, smooth){
  const p = new THREE.Vector3(...VIEWS[k][0]), t = VIEWS[k][1].clone();
  if (smooth) { tween = {p0: cam.position.clone(), t0: ctl.target.clone(), p1: p, t1: t, s: performance.now(), d: 1600}; return; }
  tween = null; cam.position.copy(p); ctl.target.copy(t); ctl.update();
}
for (const k in VIEWS) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => setView(k); vb.appendChild(b); }
setView('斜め（道路側）');
if (steps.length && steps[0].view) setView(steps[0].view);
addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
// ---- 自動再生 ----
let timer = null, tStart = 0, tDur = 0;
const pPlay = document.getElementById('pPlay'), prog = document.querySelector('#prog i');
function dur(i){ const sec = +document.getElementById('pSpeed').value; return (sec + (steps[i].caption || steps[i].text).length / 25) * 1000; }
function schedule(){
  clearTimeout(timer); tStart = performance.now(); tDur = dur(cur);
  timer = setTimeout(() => { if (cur < steps.length - 1) { step(cur + 1); schedule(); } else stop(); }, tDur);
}
function play(){
  if (!steps.length) return;
  playing = true; pPlay.textContent = '❚❚ 一時停止'; ctl.autoRotate = true; ctl.autoRotateSpeed = 0.3;
  const pn = document.getElementById('panel'); if (!pn.classList.contains('min')) document.getElementById('hide').click();
  if (cur >= steps.length - 1) step(0); else step(cur);
  schedule();
}
function stop(){ playing = false; clearTimeout(timer); pPlay.textContent = '▶ 自動再生'; ctl.autoRotate = false; prog.style.width = '0'; }
pPlay.onclick = () => playing ? stop() : play();
document.getElementById('pNext').onclick = () => { if (cur < steps.length - 1) { step(cur + 1); if (playing) schedule(); } };
document.getElementById('pPrev').onclick = () => { if (cur > 0) { step(cur - 1); if (playing) schedule(); } };
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); pPlay.click(); } if (e.key === 'ArrowRight') document.getElementById('pNext').click(); if (e.key === 'ArrowLeft') document.getElementById('pPrev').click(); });
if (!steps.length) document.getElementById('player').style.display = 'none';
if (location.hash === '#auto') setTimeout(play, 800);          // ファイル名の後ろに #auto を付けて開くと自動で始まる
// 札が重ならない・画面からはみ出さないように、毎回ずらす（文字の大きさは画面上で一定）
    function declutter(){
      const W = innerWidth, H = innerHeight, P = cam.projectionMatrix.elements[5], placed = [];
      const pn = document.getElementById('panel');
      if (pn && !pn.classList.contains('min') && pn.offsetParent) { const r = pn.getBoundingClientRect(); placed.push([r.left, r.top, r.right, r.bottom]); }
      const capOn = document.getElementById('cap').classList.contains('show') && document.getElementById('cap').offsetParent;
      const bottom = H - (capOn ? 170 : 60);
      for (const L of LBL) {
        const sp = L.sp; if (!sp.visible || (sp.parent && sp.parent !== scene && !sp.parent.visible)) continue;
        const p = sp.position.clone().project(cam); if (p.z > 1) continue;
        const cx = (p.x + 1) / 2 * W, cy = (1 - p.y) / 2 * H, h = sp.scale.y * P / 2 * H, w = h * L.ar;
        let best = null, first = null;
        for (const d of [0, 1.15, -1.15, 2.3, -2.3, 3.45, -3.45, 4.6, -4.6, 5.75, -5.75, 6.9]) {
          const x0 = Math.min(Math.max(cx - w/2, 4), W - w - 4), y0 = Math.min(Math.max(cy - h/2 + d*h, 4), bottom - h);
          const r = [x0, y0, x0 + w, y0 + h]; if (!first) first = r;
          if (!placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) { best = r; break; }
        }
        best = best || first; placed.push(best);
        sp.center.set(0.5 - ((best[0] + best[2]) / 2 - cx) / w, 0.5 + ((best[1] + best[3]) / 2 - cy) / h);
      }
    }
    (function loop(){
  requestAnimationFrame(loop);
  if (tween) {
    const a = Math.min(1, (performance.now() - tween.s) / tween.d), e = a < .5 ? 2*a*a : 1 - Math.pow(-2*a + 2, 2) / 2;
    cam.position.lerpVectors(tween.p0, tween.p1, e); ctl.target.lerpVectors(tween.t0, tween.t1, e);
    if (a >= 1) tween = null;
  }
  if (playing) prog.style.width = Math.min(100, (performance.now() - tStart) / tDur * 100) + '%';
  ctl.update(); declutter(); ren.render(scene, cam);
})();
</script>
<script>
// 説明ラベルを消す／出すボタン（あとから付けたもの。add_label_toggle.py 2026-10-25）
(function(){
  if (document.getElementById('pLbl')) return;
  const b = document.createElement('button'); b.id = 'pLbl'; b.title = '説明ラベルを消す／出す（キー L）'; b.textContent = '🏷 説明ラベルを消す';
  const pl = document.getElementById('player');
  if (pl) pl.appendChild(b); else { b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:30;padding:6px 12px;border-radius:16px'; document.body.appendChild(b); }
  let hid = false;
  function tg(){ hid = !hid; scene.traverse(o => { if (o.isSprite) o.visible = !hid; });
    b.textContent = hid ? '🏷 説明ラベルを出す' : '🏷 説明ラベルを消す'; b.classList.toggle('on', hid); }
  b.onclick = tg;
  addEventListener('keydown', e => { if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey) tg(); });
})();
</script>
